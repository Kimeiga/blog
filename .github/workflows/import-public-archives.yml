name: Import WordPress writing archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import-public-archives.mjs'
      - '.github/workflows/import-public-archives.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import WordPress archive
        shell: bash
        run: |
          set -euo pipefail
          # The combined importer also contains a Substack path, but Substack
          # currently blocks GitHub-hosted runners. Commit the complete working
          # WordPress + Lonely-CLA archive now instead of withholding it.
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/import-public-archives.mjs')
          text = path.read_text()
          old = 'const substackCount = await importSubstack();'
          new = 'const substackCount = 0;'
          if old not in text:
              raise SystemExit('expected Substack call not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/import-public-archives.mjs
          git checkout -- scripts/import-public-archives.mjs

      - name: Normalize imported metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('src/content/posts/imported/wordpress')
          fallback = 'Imported from Hakan Alpay’s earlier WordPress archive.'
          fixed = 0
          for path in root.glob('*.md'):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'(?m)^description:\s*(.+)$', text)
              if not match:
                  continue
              try:
                  value = json.loads(match.group(1))
              except Exception:
                  value = match.group(1).strip(' "\'')
              if len(value.strip()) >= 20:
                  continue
              replacement = 'description: ' + json.dumps(fallback, ensure_ascii=False)
              text = text[:match.start()] + replacement + text[match.end():]
              path.write_text(text, encoding='utf-8')
              fixed += 1
              print(f'Normalized short description: {path}')
          print(f'Normalized {fixed} short description(s).')
          PY

      - name: Commit recovered WordPress archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts/imported/wordpress public/images/imported/wordpress docs/PUBLIC_ARCHIVE_IMPORT.md
          if git diff --cached --quiet; then
            echo 'WordPress archive already up to date.'
          else
            git commit -m 'content: import WordPress archive and Lonely-CLA'
            git push
          fi

      - name: Validate full site after preserving archive
        run: npm run build
