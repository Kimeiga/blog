name: Bootstrap agentic mega blog

on:
  workflow_dispatch:
  push:
    branches: [build/agentic-mega-blog]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-mega-blog.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-mega-blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reassemble and verify the project archive
        shell: bash
        run: |
          set -euo pipefail
          for file in .bootstrap/chunk-*; do
            printf '%s ' "$(wc -c < "$file")"
            sha256sum "$file"
          done
          cat .bootstrap/chunk-* > /tmp/project.tar.gz.b64
          echo '6758f9fcd21b8d4af9ac38b5a421e350800b50a2ceabb1147d6c45cc1bab6865  /tmp/project.tar.gz.b64' | sha256sum -c -
          base64 --decode /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          echo 'a92fdcc1fb3f7ffa3ee177a66d1a7cdb6d86857472f269c8acd4524ba0164f77  /tmp/project.tar.gz' | sha256sum -c -
          tar -tzf /tmp/project.tar.gz > /dev/null

      - name: Replace the old theme atomically
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.json
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xzf /tmp/project.tar.gz -C .
          cp /tmp/package-lock.json package-lock.json
          rm -rf .bootstrap

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the image optimizer
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Import authored archives
        run: node scripts/import-legacy.mjs --force

      - name: Normalize migrated publication dates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/content/posts/legacy')
          fixed = 0
          for path in sorted(root.glob('*.md')):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'(?m)^published:\s*(.*?)\s*$', text)
              current = match.group(1).strip(' "\'') if match else ''
              if re.match(r'^\d{4}-\d{2}-\d{2}(?:$|[ T])', current):
                  continue

              candidates = re.findall(r'(?<!\d)((?:19|20)\d{2}-\d{2}-\d{2})(?!\d)', text)
              if not candidates:
                  raise SystemExit(f'Could not recover a publication date for {path}')
              recovered = candidates[0]
              if match:
                  text = text[:match.start()] + f'published: {recovered}' + text[match.end():]
              else:
                  if not text.startswith('---\n'):
                      raise SystemExit(f'Missing front matter in {path}')
                  text = text.replace('---\n', f'---\npublished: {recovered}\n', 1)
              path.write_text(text, encoding='utf-8')
              print(f'Normalized {path}: {current!r} -> {recovered}')
              fixed += 1
          print(f'Normalized {fixed} migrated publication date(s).')
          PY

      - name: Fetch optional launch photography
        shell: bash
        run: |
          set +e
          node scripts/fetch-editorial-images.mjs
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Editorial image acquisition failed with exit code $status. Continuing without optional remote photography so a third-party host cannot block publication."
          fi
          exit 0

      - name: Validate the production build before publishing source
        run: |
          npm ci
          npm run build

      - name: Commit the canonical blog source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: launch agentic mega blog'
          git push
